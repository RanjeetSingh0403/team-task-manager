<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Task Manager</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f4f7f6;color:#172026;">
        <section style="width:min(420px,calc(100% - 32px));padding:24px;border:1px solid #d9e4e0;border-radius:8px;background:white;">
          <h1 style="margin-top:0;">Team Task Manager</h1>
          <p>Loading application...</p>
        </section>
      </main>
    </div>
    <script>
      window.addEventListener('error', function (event) {
        document.getElementById('root').innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f4f7f6;color:#172026;"><section style="width:min(620px,calc(100% - 32px));padding:24px;border:1px solid #d9e4e0;border-radius:8px;background:white;"><h1 style="margin-top:0;">Application error</h1><p style="white-space:pre-wrap;">' + event.message + '</p></section></main>';
      });
      window.addEventListener('unhandledrejection', function (event) {
        document.getElementById('root').innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f4f7f6;color:#172026;"><section style="width:min(620px,calc(100% - 32px));padding:24px;border:1px solid #d9e4e0;border-radius:8px;background:white;"><h1 style="margin-top:0;">Application error</h1><p style="white-space:pre-wrap;">' + (event.reason && event.reason.message ? event.reason.message : event.reason) + '</p></section></main>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
